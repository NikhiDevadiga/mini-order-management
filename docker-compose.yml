services:
  backend:
    build:
      context: ./server
    container_name: order-management-backend
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: order-management-frontend
    ports:
      - "3000:80"
    depends_on:
     - backend
